<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StellarPass | Decentralized Event Ticketing on Stellar</title>
    <meta name="description" content="Create events, mint verifiable tickets, transfer ownership, verify attendance with QR codes, and settle secondary market royalties on-chain with Soroban smart contracts." />
    <meta name="theme-color" content="#0f1115" />
    <meta name="application-name" content="StellarPass" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://stellarpass.app" />

    <!-- Open Graph -->
    <meta property="og:title" content="StellarPass | Decentralized Event Ticketing on Stellar" />
    <meta property="og:description" content="Create events, mint verifiable tickets, transfer ownership, verify attendance with QR codes, and settle secondary market royalties on-chain with Soroban smart contracts." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://stellarpass.app" />
    <meta property="og:image" content="https://stellarpass.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="StellarPass | Decentralized Event Ticketing on Stellar" />
    <meta name="twitter:description" content="Create events, mint verifiable tickets, transfer ownership, verify attendance with QR codes, and settle secondary market royalties on-chain with Soroban smart contracts." />
    <meta name="twitter:image" content="https://stellarpass.app/og-image.png" />

    <!-- Preconnect for Google Fonts (critical render path) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Preload critical subset (Inter weights used in hero/headings) -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" as="style" />
    <!-- Non-blocking font load via swap + media='print' trick -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      media="print"
      onload="this.media='all';this.onload=null"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
    </noscript>


    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Favicon - SVG for sharp rendering on all displays, PNG fallback for older browsers -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <script>
      // Prevent theme flicker on load, runs before React mounts
      (function() {
        var theme = window.localStorage.getItem('stellarpass-theme');
        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
    <!-- JSON-LD Structured Data for SEO -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "StellarPass",
      "url": "https://stellarpass.app",
      "description": "Decentralized event ticketing built on Stellar. Create events, mint verifiable tickets, transfer ownership, verify attendance with QR codes, and settle secondary market royalties on-chain with Soroban smart contracts.",
      "applicationCategory": "Ticketing",
      "operatingSystem": "Any",
      "author": {
        "@type": "Organization",
        "name": "StellarPass",
        "url": "https://stellarpass.app"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

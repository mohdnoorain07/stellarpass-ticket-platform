<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="brand-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7e57"/>
      <stop offset="100%" stop-color="#ff6a3d"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <rect x="4" y="4" width="88" height="88" rx="20" fill="#171a21"/>
  <!-- Stellar star emblem (four-pointed star representing Stellar network) -->
  <path d="M48 18 L53 38 L72 43 L53 48 L48 68 L43 48 L24 43 L43 38 Z" fill="url(#brand-grad)"/>
  <!-- Inner star for depth -->
  <path d="M48 30 L50.5 39.5 L60 42 L50.5 44.5 L48 54 L45.5 44.5 L36 42 L45.5 39.5 Z" fill="#ffffff" opacity="0.2"/>
  <!-- Ticket/pass notch at bottom-right of star -->
  <rect x="58" y="50" width="14" height="14" rx="3" fill="url(#brand-grad)" opacity="0.9"/>
  <rect x="60" y="52" width="10" height="10" rx="2" fill="#171a21"/>
  <!-- Glare highlight -->
  <rect x="4" y="4" width="88" height="88" rx="20" fill="url(#accent-grad)"/>
</svg>
